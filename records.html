<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Record — SpinWave</title>
<meta name="description" content="A validated SpinWave record, with its pipeline state and, once confirmed, its Base anchor.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  :root{ --vellum:#EDE4D0; --parchment:#DCCFAF; --umber:#2E2419; --sepia:#4A3B28; --oxblood:#6E3232; --gold:#A8894A; }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'EB Garamond',Georgia,serif;background:var(--vellum);color:var(--umber);line-height:1.65;}
  .wrap{max-width:820px;margin:0 auto;padding:0 1.4rem;}
  .nav{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:.65rem clamp(1.25rem,5vw,2.5rem);background:rgba(237,228,208,.97);border-bottom:3px double var(--gold);}
  .nav a{font-family:'Cormorant Garamond',serif;font-variant:small-caps;letter-spacing:.08em;font-weight:600;color:var(--sepia);text-decoration:none;}
  h1{font-size:2.2rem;font-weight:600;margin:2rem 0 .5rem;line-height:1.25;}
  .fields{margin:2rem 0;border:1px solid var(--gold);background:rgba(255,255,255,.45);}
  .field{display:flex;gap:1rem;padding:.85rem 1.2rem;border-bottom:1px dotted rgba(168,137,74,.6);flex-wrap:wrap;}
  .field:last-child{border-bottom:none;}
  .field .k{flex:none;width:11rem;font-size:.82rem;letter-spacing:.2em;text-transform:uppercase;color:var(--sepia);}
  .field .v{flex:1;min-width:14rem;font-size:1.08rem;}
  code{font-family:ui-monospace,monospace;font-size:.82rem;background:rgba(46,36,25,.08);padding:.2rem .5rem;word-break:break-all;}
  .fine{color:var(--sepia);font-size:1.02rem;margin:1rem 0;}
</style>
</head>
<body>
<nav class="nav"><a href="/">← SpinWave</a><a href="/#verify">Verify a certificate</a></nav>
<main class="wrap">
  <h1 id="rec-title">Record</h1>
  <p class="fine" id="rec-status" role="status" aria-live="polite">Loading this record…</p>
  <div class="fields" id="rec-fields" hidden></div>
  <p class="fine">A record is certified only when its anchor has confirmed on Base. An anchor shown as pending is not a certificate, and a record without a payment reference was never paid through this pipeline.</p>
</main>
<script>
(function(){
  "use strict";
  function esc(s){ return String(s == null ? "" : s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
  var id = new URLSearchParams(window.location.search).get("id") || "";
  var status = document.getElementById("rec-status"), title = document.getElementById("rec-title"), fields = document.getElementById("rec-fields");
  if (!id) { status.textContent = "No record ID was given. Open a record from My Works, or from a certificate link."; return; }
  fetch("/api/records?id=" + encodeURIComponent(id)).then(function(r){
    if (r.status === 404) { status.textContent = "NOT FOUND — no SpinWave record matches that ID."; return null; }
    if (!r.ok) { status.textContent = "Could not load this record right now."; return null; }
    return r.json();
  }).then(function(d){
    if (!d || !d.record) return;
    var rec = d.record;
    title.textContent = rec.title || rec.id;
    status.textContent = "State: " + rec.state + (rec.state === "certified" ? " — certified." : ".");
    var rows = [
      ["Record ID", "<code>" + esc(rec.id) + "</code>"],
      ["Authors", esc(rec.authors)],
      ["Version", esc(rec.version)],
      ["Scholar wallet", rec.scholar_wallet ? "<code>" + esc(rec.scholar_wallet) + "</code>" : "—"],
      ["State", esc(rec.state)],
      ["Anchor (Base hash)", rec.anchor_tx ? "<a href=\"https://basescan.org/tx/" + esc(rec.anchor_tx) + "\"><code>" + esc(rec.anchor_tx) + "</code></a>" : "Pending — no confirmed anchor yet."],
      ["Certificate", rec.certificate_id ? "<code>" + esc(rec.certificate_id) + "</code>" : "Not issued yet — a certificate is issued only after the anchor confirms."]
    ];
    fields.innerHTML = rows.map(function(r){ return "<div class=\"field\"><span class=\"k\">" + r[0] + "</span><span class=\"v\">" + r[1] + "</span></div>"; }).join("");
    fields.hidden = false;
  }).catch(function(){ status.textContent = "Could not load this record right now."; });
})();
</script>
</body>
</html>
